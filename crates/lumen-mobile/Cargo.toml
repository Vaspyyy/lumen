[package]
name = "lumen-mobile"
version = "0.5.0"
edition = "2024"
license = "GPL-3.0-or-later"
description = "lumen's terminal and its connection to a PC, for the Android app"
repository = "https://github.com/Vaspyyy/lumen"

[lib]
crate-type = ["cdylib", "rlib"]

[dependencies]
lumen-link = { path = "../lumen-link" }
alacritty_terminal = "0.26"
russh = { version = "0.65", default-features = false, features = ["ring"] }
tokio = { version = "1", features = ["rt-multi-thread", "net", "time", "sync", "io-util", "macros"] }
jni = "0.21"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
base64 = "0.22"
