[package]
name = "lumen-link"
version = "0.5.0"
edition = "2024"
license = "GPL-3.0-or-later"
description = "What lumen on a PC and lumen on a phone say to each other"
repository = "https://github.com/Vaspyyy/lumen"

[dependencies]
base64 = "0.22"
ed25519-dalek = { version = "2", default-features = false, features = ["std"] }
getrandom = "0.3"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sha2 = "0.10"
