name: Release

# What a release offers: the archive with its install script, the Debian
# package, the RPM and the Arch package, each tried on a clean system before
# anything is published, and the Android app, signed with lumen's key.
# The key is in the "release" environment, which only tags named v* may use.
#
# A tag publishes:    git tag v0.2.2 && git push origin v0.2.2
# Started by hand, it builds and tries everything and publishes nothing.
on:
  push:
    # three numbers and nothing after them: a package can't carry a version like 1.0.0-rc1
    tags: ['v[0-9]+.[0-9]+.[0-9]+']
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  build:
    name: Build and package
    runs-on: ubuntu-latest
    # An old system on purpose: what is built here runs on every newer one.
    container: ubuntu:22.04
    steps:
      - name: Tools, and the libraries GPUI links against
        run: |
          # apt-lists.sh does this for the jobs below, but this one has no git
          # yet to fetch the repository with: a source that doesn't answer for
          # a moment is tried again, and then Ubuntu's archive is asked under
          # another name of its own (2026-11-11: no archive.ubuntu.com on the
          # runners for hours, while every other mirror answered).
          lists() { apt-get update -q -o APT::Update::Error-Mode=any; }
          if ! lists; then
            echo "the package lists could not be fetched; trying the same archive under another name"
            sed -i -e 's|//archive\.ubuntu\.com/ubuntu|//mirrors.edge.kernel.org/ubuntu|g' \
                   -e 's|//security\.ubuntu\.com/ubuntu|//mirrors.edge.kernel.org/ubuntu|g' /etc/apt/sources.list
            lists
          fi
          DEBIAN_FRONTEND=noninteractive apt-get install -y --no-install-recommends \
            ca-certificates curl git build-essential pkg-config dpkg-dev rpm \
            libxkbcommon-x11-dev libwayland-dev libx11-xcb-dev libfontconfig-dev libvulkan-dev libasound2-dev
      - uses: actions/checkout@v7
      - name: Rust
        run: |
          curl --proto '=https' --tlsv1.2 -sSf https://sh.rustup.rs | sh -s -- -y --profile minimal
          echo "$HOME/.cargo/bin" >> "$GITHUB_PATH"
      - name: The tag names the version in Cargo.toml
        if: github.ref_type == 'tag'
        run: |
          version=$(sed -n 's/^version = "\(.*\)"$/\1/p' Cargo.toml | head -n 1)
          if [ "$GITHUB_REF_NAME" != "v$version" ]; then
            echo "the tag is $GITHUB_REF_NAME, Cargo.toml says $version"
            exit 1
          fi
      - run: cargo build --release --locked
      - run: packaging/package.sh
      - uses: actions/upload-artifact@v7
        with:
          name: packages
          path: dist/
          if-no-files-found: error

  arch:
    name: Arch package
    needs: build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/download-artifact@v8
        with:
          name: packages
          path: dist
      - run: docker run --rm -v "$PWD:/lumen" archlinux:base-devel sh /lumen/packaging/arch/build.sh
      - uses: actions/upload-artifact@v7
        with:
          name: arch-package
          path: dist/lumen-terminal-x86_64.pkg.tar.zst
          if-no-files-found: error

  verify:
    name: Try the ${{ matrix.kind }} on ${{ matrix.image }}
    needs: [build, arch]
    # Ubuntu's own entries are gone: on 2026-11-11 the runners could not
    # resolve archive.ubuntu.com for hours, and a release waited on it while
    # the same deb was fine on Debian 12 and 13, whose glibc (2.35 and 2.41)
    # brackets Ubuntu 22.04 and 24.04, and whose packages carry the same
    # names. A release waiting for one mirror's DNS is worth less than that.
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - { image: 'debian:12', kind: deb }
          - { image: 'debian:13', kind: deb }
          - { image: 'fedora:latest', kind: rpm }
          - { image: 'opensuse/tumbleweed', kind: zypper }
          - { image: 'archlinux:latest', kind: arch }
          - { image: 'debian:12', kind: script }
    steps:
      - uses: actions/checkout@v7
      - uses: actions/download-artifact@v8
        with:
          path: dist
          merge-multiple: true
      - name: Install it, open a window, remove it
        env:
          IMAGE: ${{ matrix.image }}
          KIND: ${{ matrix.kind }}
        run: docker run --rm -v "$PWD:/lumen:ro" "$IMAGE" sh /lumen/packaging/verify.sh "$KIND"

  android:
    name: Android app
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: 17
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: aarch64-linux-android
      - run: cargo install cargo-ndk --locked --version 4.1.2
      - name: The app carries the version in Cargo.toml
        run: |
          version=$(sed -n 's/^version = "\(.*\)"$/\1/p' Cargo.toml | head -n 1)
          grep -q "versionName = \"$version\"" android/app/build.gradle.kts || {
            echo "Cargo.toml says $version, android/app/build.gradle.kts says something else"
            exit 1
          }
      - name: The core, for phones
        run: android/build-core.sh arm64-v8a
      # Built without a key: nothing that runs in this build can see one.
      - name: The app, not signed yet
        working-directory: android
        run: ./gradlew --no-daemon :app:assembleRelease
      - uses: actions/upload-artifact@v7
        with:
          name: android-unsigned
          path: android/app/build/outputs/apk/release/app-release-unsigned.apk
          if-no-files-found: error

  sign:
    name: Sign the Android app
    # Only the push of a release tag gets lumen's key: it is kept in an
    # environment that no branch and no run started by hand can use.
    if: github.event_name == 'push' && github.ref_type == 'tag'
    needs: android
    runs-on: ubuntu-latest
    environment: release
    steps:
      - uses: actions/download-artifact@v8
        with:
          name: android-unsigned
      - name: Sign it, and check whose signature it carries
        env:
          KEYSTORE: ${{ secrets.ANDROID_KEYSTORE_B64 }}
          KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
        run: |
          tools=$(find "$ANDROID_HOME/build-tools" -mindepth 1 -maxdepth 1 -type d | sort -V | tail -n 1)
          printf '%s' "$KEYSTORE" | base64 -d > "$RUNNER_TEMP/release.jks"
          mkdir dist
          "$tools/zipalign" -f -P 16 4 app-release-unsigned.apk aligned.apk
          "$tools/apksigner" sign --ks "$RUNNER_TEMP/release.jks" --ks-key-alias lumen \
            --ks-pass env:KEYSTORE_PASSWORD --key-pass env:KEYSTORE_PASSWORD \
            --out dist/lumen-android.apk aligned.apk
          rm "$RUNNER_TEMP/release.jks"
          signers=$("$tools/apksigner" verify --print-certs dist/lumen-android.apk | grep 'certificate SHA-256 digest')
          echo "$signers"
          [ "$(echo "$signers" | wc -l)" = 1 ]
          echo "$signers" | grep -q -i 'e45200452aa3f2f6276debd70005230e01b7974e41931f66c232720903ff99ed'
          rm -f dist/*.idsig
      - uses: actions/upload-artifact@v7
        with:
          name: android-app
          path: dist/lumen-android.apk
          if-no-files-found: error

  publish:
    name: Publish
    # only the push of a tag publishes, not a run started by hand on one
    if: github.event_name == 'push' && github.ref_type == 'tag'
    needs: [build, arch, verify, sign]
    runs-on: ubuntu-latest
    permissions:
      contents: write
      id-token: write
      attestations: write
      artifact-metadata: write
    steps:
      - uses: actions/checkout@v7
      - uses: actions/download-artifact@v8
        with:
          path: dist
          merge-multiple: true
      - name: Checksums, of exactly what a release offers
        run: |
          cd dist
          rm -f app-release-unsigned.apk
          offered=$(LC_ALL=C ls | tr '\n' ' ')
          echo "$offered"
          [ "$offered" = "lumen-android.apk lumen-terminal-x86_64.pkg.tar.zst lumen-terminal.x86_64.rpm lumen-terminal_amd64.deb lumen-x86_64-linux.tar.gz " ]
          sha256sum -- * > ../SHA256SUMS
          mv ../SHA256SUMS .
          cat SHA256SUMS
      # GitHub signs a statement that these files were built here, from this commit
      - uses: actions/attest@v4
        with:
          subject-checksums: dist/SHA256SUMS
      - name: The release, with its note from the website
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          version=${GITHUB_REF_NAME#v}
          packaging/release-notes.sh "$version" > notes.md
          title=$(sed -n 's/^title: *//p' "site/src/content/releases/$version.md" | head -n 1 | sed 's/^"\(.*\)"$/\1/')
          gh release create "$GITHUB_REF_NAME" dist/* --verify-tag --title "$version: $title" --notes-file notes.md
