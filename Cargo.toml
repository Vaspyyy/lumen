[package]
name = "lumen"
version = "0.5.2"
edition = "2024"
license = "GPL-3.0-or-later"
description = "A terminal emulator that understands what your tools print"
repository = "https://github.com/Vaspyyy/lumen"

[workspace]
members = [".", "crates/lumen-link", "crates/lumen-mobile"]
default-members = ["."]
# a copy of a crate lumen changes, not a part of lumen: see vendor/README.md
exclude = ["vendor"]

[dependencies]
# What a PC and a phone say to each other: pairing, the terminals a PC keeps.
lumen-link = { path = "crates/lumen-link" }
# GPUI Fast (longbridge/gpui-fast): Zed's GPUI, rendering with wgpu on Linux.
gpui = { package = "gpui-fast", version = "0.1.14" }
gpui_platform = { package = "gpui-fast-platform", version = "0.1.14", features = ["wayland", "x11", "font-kit"] }
# GPUI's renderer (vendored, see vendor/README.md): main starts the GPU early with it.
gpui_wgpu = { package = "gpui-fast-wgpu", version = "0.1.14" }
# The terminal itself: escape sequences, the grid, scrollback, selection, the PTY.
alacritty_terminal = "0.26"
serde = { version = "1", features = ["derive"] }
toml = "1.1"
dirs = "5"
futures = "0.3"
# Waiting on the PTY, as alacritty_terminal's own event loop does.
polling = "3"
# Inline images (the kitty graphics protocol).
image = { version = "0.25", default-features = false, features = ["png"] }
base64 = "0.22"
flate2 = "1"
# The phone side: QR codes for pairing, the system calls of the keeper, its messages.
qrcode = { version = "0.14", default-features = false }
libc = "0.2"
serde_json = "1"

[profile.dev]
# The grid is drawn every frame: unoptimized, a full screen of text stutters.
opt-level = 1

[profile.dev.package."*"]
opt-level = 2

[profile.release]
strip = true
lto = "thin"

[patch.crates-io]
# GPUI's renderer, with lumen's changes: see vendor/README.md
gpui-fast-wgpu = { path = "vendor/gpui-fast-wgpu" }
